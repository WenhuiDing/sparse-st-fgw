[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-st-fgw"
version = "1.0.0"
description = "Scalable sparse Fused Gromov-Wasserstein alignment for time-series spatial transcriptomics"
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "anndata",
  "jax",
  "numpy",
  "pandas",
  "pynndescent",
  "psutil",
  "scikit-learn",
  "scipy",
  "torch",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparse_st_fgw*"]

[tool.setuptools.package-data]
sparse_st_fgw = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
